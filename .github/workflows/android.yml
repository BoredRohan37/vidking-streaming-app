name: Android build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  NDK_VERSION: 26.3.11579264

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android NDK and platform
        run: sdkmanager --install "ndk;${NDK_VERSION}" "platforms;android-34" "build-tools;34.0.0"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build the native library (Rust)
        working-directory: gui
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
        run: >
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64
          -o ../android/app/src/main/jniLibs
          build --release --lib --features android-game-activity

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build the APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: MovieBox-android-apk
          path: android/app/build/outputs/apk/release/*.apk
