[package]
name = "feathercode"
version = "0.1.0"
description = "FeatherCode — a lightweight AI code editor for Linux"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
futures-util = "0.3"
ssh2 = { version = "0.9" }  # uses system OpenSSL (libssl-dev). If your distro lacks it, add features = ["vendored-openssl"] (much slower build)
portable-pty = "0.8"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
# NOTE: no LTO / codegen-units=1 — too memory-hungry for low-RAM machines (3 GB)
