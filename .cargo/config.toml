[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=65536"]

# --- Windows 7 / 8.1 builds -------------------------------------------------
# Tier 3 targets: need nightly Rust + `-Zbuild-std`. Use win7/build-win7.sh
# (sets the mingw linker/compiler for the gnu targets) or see docs/windows7.md.
[target.x86_64-win7-windows-gnu]
rustflags = ["-C", "target-feature=+crt-static"]

[target.i686-win7-windows-gnu]
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-win7-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.i686-win7-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
